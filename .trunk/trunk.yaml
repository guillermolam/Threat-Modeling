# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: d1e3af5752059371e206fe8f242b15d7f4205555 # v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - git-diff-check
    - pinact@4.1.1
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - yamllint@1.38.0
  definitions:
    - name: shfmt
      commands:
        - name: format
          run: shfmt -w -s -i 2 -ci "${target}"
actions:
  enabled:
    - security-pre-commit
    - security-pre-push
    - trunk-check-pre-commit
    - trunk-check-pre-push-always
  definitions:
    - id: security-pre-commit
      display_name: Security pre-commit
      description: Scan the exact Git index and conditionally audit GitHub Actions
      triggers:
        - git_hooks: [pre-commit]
      run: ./scripts/hooks/pre-commit.sh
    - id: security-pre-push
      display_name: Security pre-push
      description: Scan every outgoing Git range and conditionally audit GitHub Actions
      triggers:
        - git_hooks: [pre-push]
      run: ./scripts/hooks/pre-push.sh "${1}" "${2}" '${hook_stdin_path}'
      interactive: optional
