name: Architecture blueprint

on:
  pull_request:
    paths:
      - .github/workflows/architecture-blueprint.yml
      - Examples/S3/architecture/**
      - Examples/S3/infra/**
      - Examples/S3/threat-modeling/**
      - scripts/architecture/**
      - scripts/ci/**
      - scripts/threat-modeling/**
      - tests/architecture/**
      - tests/threat-modeling/**
      - Taskfile.yml
      - config/tool-versions.env
  push:
    branches: [main]
    paths:
      - .github/workflows/architecture-blueprint.yml
      - Examples/S3/architecture/**
      - Examples/S3/infra/**
      - Examples/S3/threat-modeling/**
      - scripts/architecture/**
      - scripts/ci/**
      - scripts/threat-modeling/**
      - tests/architecture/**
      - tests/threat-modeling/**
      - Taskfile.yml
      - config/tool-versions.env
  schedule:
    - cron: 17 4 * * 1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-blueprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: Offline architecture contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
          check-latest: false

      - name: Set up pinned Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21.0.12+8.0.LTS

      - name: Set up pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0

      - name: Install checksum-pinned architecture tools
        run: task architecture:tools:install

      - name: Run the local architecture unit contract
        run: task architecture:test

  isolated-floci:
    name: Isolated Floci evidence and blueprint
    needs: offline-contract
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
          check-latest: false

      - name: Set up pinned Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21.0.12+8.0.LTS

      - name: Set up pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0

      - name: Install checksum-pinned architecture tools
        run: task architecture:tools:install

      - name: Rebuild evidence and reject model drift
        env:
          ARCHITECTURE_ARTIFACT_DIR: ${{ runner.temp }}/meridian-architecture-artifacts
        run: task architecture:integration

      - name: Upload sanitized evidence and generated diagrams
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-architecture-${{ github.run_id }}
          path: ${{ runner.temp }}/meridian-architecture-artifacts
          if-no-files-found: error
          retention-days: 14
